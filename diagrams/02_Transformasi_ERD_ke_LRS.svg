<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="25" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="800" y="39" dominant-baseline="middle">3.2.2 Transformasi ERD ke Logical Record Structure (LRS)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="middle" ><tspan x="800" y="72" dominant-baseline="middle">RuangBaik | Model hybrid: PostgreSQL (off-chain) + Ethereum Sepolia (on-chain)</tspan></text><rect x="40" y="105" width="1520" height="465" fill="#ffffff" stroke="#555555" stroke-width="1.5" stroke-dasharray="7 5"/><text font-family="Arial" font-size="18" fill="#555555" text-anchor="middle" ></text><text font-family="Arial" font-size="19" fill="#222222" text-anchor="start" font-weight="bold"><tspan x="77" y="128" dominant-baseline="middle">OFF-CHAIN — Transformasi relasi R01 (1:N) menjadi dua record</tspan></text><rect x="90" y="160" width="450" height="350" fill="#ffffff" stroke="#536a83" stroke-width="1.5" stroke-dasharray="7 5"/><text font-family="Arial" font-size="18" fill="#536a83" text-anchor="middle" ></text><rect x="620" y="160" width="880" height="350" fill="#ffffff" stroke="#536a83" stroke-width="1.5" stroke-dasharray="7 5"/><text font-family="Arial" font-size="18" fill="#536a83" text-anchor="middle" ></text><rect x="150" y="185" width="260" height="50" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="280" y="210" dominant-baseline="middle">USERS</tspan></text><polygon points="732.5,172 805,210 732.5,248 660,210" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text font-family="Arial" font-size="17" fill="#222222" text-anchor="middle" ><tspan x="732.5" y="210" dominant-baseline="middle">Membuat</tspan></text><rect x="1050" y="185" width="310" height="50" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="1205" y="210" dominant-baseline="middle">CAMPAIGNS</tspan></text><polyline points="410,210 660,210" fill="none" stroke="#222222" stroke-width="1.5"  /><polyline points="805,210 1050,210" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="585" y="188" dominant-baseline="middle">1</tspan></text><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="945" y="188" dominant-baseline="middle">0..N</tspan></text><rect x="140" y="285" width="350" height="98" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="140" y="285" width="350" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="315" y="306" dominant-baseline="middle">USERS</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="152" y="341" dominant-baseline="middle">wallet_address [PK]</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="152" y="369" dominant-baseline="middle">name, bio, created_at</tspan></text><rect x="890" y="285" width="540" height="126" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="890" y="285" width="540" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="1160" y="306" dominant-baseline="middle">CAMPAIGNS</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="902" y="341" dominant-baseline="middle">id [PK]</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="902" y="369" dominant-baseline="middle">creator_address [FK]</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="902" y="397" dominant-baseline="middle">... atribut E02 lainnya tetap</tspan></text><polyline points="490,341 760,341 760,369 890,369" fill="none" stroke="#222222" stroke-width="1.5"  marker-end="url(#arrow)"/><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="755" y="267.6" dominant-baseline="middle">PK sisi 1 → FK sisi N</tspan><tspan x="755" y="290" dominant-baseline="middle">wallet_address →</tspan><tspan x="755" y="312.40000000000003" dominant-baseline="middle">creator_address</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="1060" y="437.8" dominant-baseline="middle">Relasi Membuat diserap ke record CAMPAIGNS.</tspan><tspan x="1060" y="460.2" dominant-baseline="middle">Tidak terbentuk tabel penghubung; seluruh atribut E01/E02 tetap dipertahankan.</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="middle" ><tspan x="795" y="535" dominant-baseline="middle">Daftar lengkap atribut record hasil transformasi disajikan pada halaman 3.2.3 (LRS).</tspan></text><rect x="40" y="640" width="1520" height="445" fill="#ffffff" stroke="#536a83" stroke-width="1.5" stroke-dasharray="7 5"/><text font-family="Arial" font-size="18" fill="#536a83" text-anchor="middle" ></text><text font-family="Arial" font-size="19" fill="#222222" text-anchor="start" font-weight="bold"><tspan x="77" y="663" dominant-baseline="middle">ON-CHAIN — Ethereum Sepolia / smart contract Crowdfunding</tspan></text><rect x="110" y="723" width="480" height="210" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="110" y="723" width="480" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="350" y="744" dominant-baseline="middle">Campaign «struct dalam mapping»</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="779" dominant-baseline="middle">campaignId : uint256 (kunci mapping)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="807" dominant-baseline="middle">creator : address</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="835" dominant-baseline="middle">target : uint256 (wei)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="863" dominant-baseline="middle">deadline : uint256 (Unix detik)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="891" dominant-baseline="middle">raised : uint256 (wei)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="919" dominant-baseline="middle">withdrawn : uint256 (wei)</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="350" y="975.8" dominant-baseline="middle">campaigns: mapping(uint256 =&gt; Campaign)</tspan><tspan x="350" y="998.1999999999999" dominant-baseline="middle">campaignId bukan anggota struct Campaign.</tspan></text><rect x="1020" y="705" width="470" height="70" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="1020" y="705" width="470" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="1255" y="726" dominant-baseline="middle">CampaignCreated «event»</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="1032" y="761" dominant-baseline="middle">campaignId, creator, target, deadline</tspan></text><polyline points="590,775 720,775 720,740 1020,740" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="912.5" y="719" dominant-baseline="middle">1 : 1 (pembuatan)</tspan></text><rect x="1020" y="817" width="470" height="70" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="1020" y="817" width="470" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="1255" y="838" dominant-baseline="middle">DonationReceived «event»</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="1032" y="873" dominant-baseline="middle">campaignId, donor, amount, timestamp</tspan></text><polyline points="590,775 765,775 765,852 1020,852" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="912.5" y="831" dominant-baseline="middle">1 : 0..N</tspan></text><rect x="1020" y="929" width="470" height="98" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="1020" y="929" width="470" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="1255" y="950" dominant-baseline="middle">FundsWithdrawn «event»</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="1032" y="985" dominant-baseline="middle">campaignId, creator, amount,</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="1032" y="1013" dominant-baseline="middle">totalWithdrawn, timestamp</tspan></text><polyline points="590,775 810,775 810,964 1020,964" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="912.5" y="943" dominant-baseline="middle">1 : 0..N</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="1120" y="1047.5" dominant-baseline="middle">TxHash dan nomor blok berasal dari log/receipt; bukan parameter event.</tspan></text><polyline points="1500,370 1535,370 1535,625 70,625 70,700 350,700 350,723" fill="none" stroke="#222222" stroke-width="1.5" stroke-dasharray="7 5" /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="860" y="591.3" dominant-baseline="middle">CAMPAIGNS.id ↔ campaignId: tautan aplikasi; bukan hasil migrasi FK.</tspan><tspan x="860" y="613.6999999999999" dominant-baseline="middle">Struct dan event tetap di blockchain, tidak ditransformasikan menjadi tabel SQL.</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="800" y="1128" dominant-baseline="middle">Konektor utuh: relasi SQL / asosiasi blockchain. Konektor putus-putus: tautan lintas penyimpanan, bukan FK SQL.</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="800" y="1158.8" dominant-baseline="middle">PK = primary key | FK = foreign key | UQ = unique | 0..N = nol atau banyak.</tspan><tspan x="800" y="1181.2" dominant-baseline="middle">Berlaku untuk satu deployment kontrak. Struktur kontrak dan event bukan tabel PostgreSQL.</tspan></text></svg>