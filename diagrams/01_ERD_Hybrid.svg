<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="25" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="800" y="39" dominant-baseline="middle">3.2.1 Entity Relationship Diagram (ERD)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="middle" ><tspan x="800" y="72" dominant-baseline="middle">RuangBaik | Model hybrid: PostgreSQL (off-chain) + Ethereum Sepolia (on-chain)</tspan></text><rect x="40" y="105" width="1520" height="465" fill="#ffffff" stroke="#555555" stroke-width="1.5" stroke-dasharray="7 5"/><text font-family="Arial" font-size="18" fill="#555555" text-anchor="middle" ></text><text font-family="Arial" font-size="19" fill="#222222" text-anchor="start" font-weight="bold"><tspan x="77" y="128" dominant-baseline="middle">OFF-CHAIN — PostgreSQL (Neon)</tspan></text><rect x="130" y="170" width="260" height="60" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="260" y="200" dominant-baseline="middle">USERS</tspan></text><polygon points="730,155 810,200 730,245 650,200" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="730" y="200" dominant-baseline="middle">Membuat</tspan></text><rect x="1060" y="170" width="280" height="60" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="1200" y="200" dominant-baseline="middle">CAMPAIGNS</tspan></text><polyline points="390,200 650,200" fill="none" stroke="#222222" stroke-width="1.5"  /><polyline points="810,200 1060,200" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="490" y="179" dominant-baseline="middle">1</tspan></text><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="945" y="179" dominant-baseline="middle">0..N</tspan></text><text font-family="Arial" font-size="18" fill="#222222" text-anchor="start" ><tspan x="112" y="292.2" dominant-baseline="middle">wallet_address [PK]</tspan><tspan x="112" y="317.4" dominant-baseline="middle">name</tspan><tspan x="112" y="342.59999999999997" dominant-baseline="middle">bio (nullable)</tspan><tspan x="112" y="367.79999999999995" dominant-baseline="middle">created_at</tspan></text><polyline points="260,230 260,250" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="start" ><tspan x="1042" y="269" dominant-baseline="middle">id [PK]</tspan><tspan x="1042" y="294.2" dominant-baseline="middle">creator_address [FK]</tspan><tspan x="1042" y="319.4" dominant-baseline="middle">title</tspan><tspan x="1042" y="344.6" dominant-baseline="middle">description</tspan><tspan x="1042" y="369.8" dominant-baseline="middle">image_url</tspan><tspan x="1042" y="395" dominant-baseline="middle">category</tspan><tspan x="1042" y="420.2" dominant-baseline="middle">location</tspan><tspan x="1042" y="445.4" dominant-baseline="middle">organizer</tspan><tspan x="1042" y="470.6" dominant-baseline="middle">creation_block</tspan><tspan x="1042" y="495.79999999999995" dominant-baseline="middle">transaction_hash [UQ]</tspan><tspan x="1042" y="521" dominant-baseline="middle">created_at</tspan></text><polyline points="1200,230 1200,245" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="17" fill="#222222" text-anchor="middle" ><tspan x="705" y="349.3" dominant-baseline="middle">Satu pengguna dapat membuat 0..N kampanye.</tspan><tspan x="705" y="373.1" dominant-baseline="middle">Setiap kampanye memiliki tepat 1 pembuat.</tspan><tspan x="705" y="396.9" dominant-baseline="middle">R01: users.wallet_address</tspan><tspan x="705" y="420.7" dominant-baseline="middle">→ campaigns.creator_address (FK)</tspan></text><rect x="40" y="640" width="1520" height="445" fill="#ffffff" stroke="#536a83" stroke-width="1.5" stroke-dasharray="7 5"/><text font-family="Arial" font-size="18" fill="#536a83" text-anchor="middle" ></text><text font-family="Arial" font-size="19" fill="#222222" text-anchor="start" font-weight="bold"><tspan x="77" y="663" dominant-baseline="middle">ON-CHAIN — Perluasan konseptual; bukan entitas relasional SQL</tspan></text><rect x="170" y="725" width="350" height="60" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="345" y="755" dominant-baseline="middle">Campaign «struct»</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="142" y="840.5" dominant-baseline="middle">campaignId : uint256 (kunci mapping)</tspan><tspan x="142" y="864.3" dominant-baseline="middle">creator : address</tspan><tspan x="142" y="888.1" dominant-baseline="middle">target : uint256 (wei)</tspan><tspan x="142" y="911.9" dominant-baseline="middle">deadline : uint256 (Unix detik)</tspan><tspan x="142" y="935.7" dominant-baseline="middle">raised : uint256 (wei)</tspan><tspan x="142" y="959.5" dominant-baseline="middle">withdrawn : uint256 (wei)</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="360" y="1021.3" dominant-baseline="middle">campaigns: mapping(uint256 =&gt; Campaign)</tspan><tspan x="360" y="1043.7" dominant-baseline="middle">campaignId adalah kunci mapping, bukan atribut struct.</tspan></text><rect x="1060" y="690" width="440" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="1280" y="711" dominant-baseline="middle">CampaignCreated «event»</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="1280" y="767" dominant-baseline="middle">campaignId, creator, target, deadline</tspan></text><polygon points="802.5,680 870,712.5 802.5,745 735,712.5" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="802.5" y="712.5" dominant-baseline="middle">Dibuat</tspan></text><polyline points="520,755 650,755 650,712 735,712" fill="none" stroke="#222222" stroke-width="1.5"  /><polyline points="870,712 1060,712" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="968" y="694" dominant-baseline="middle">1 : 1</tspan></text><rect x="1060" y="815" width="440" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="1280" y="836" dominant-baseline="middle">DonationReceived «event»</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="1280" y="892" dominant-baseline="middle">campaignId, donor, amount, timestamp</tspan></text><polygon points="802.5,805 870,837.5 802.5,870 735,837.5" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="802.5" y="837.5" dominant-baseline="middle">Mencatat</tspan></text><polyline points="520,755 668,755 668,837 735,837" fill="none" stroke="#222222" stroke-width="1.5"  /><polyline points="870,837 1060,837" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="968" y="819" dominant-baseline="middle">1 : 0..N</tspan></text><rect x="1060" y="940" width="440" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ><tspan x="1280" y="961" dominant-baseline="middle">FundsWithdrawn «event»</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="1280" y="1005.8" dominant-baseline="middle">campaignId, creator, amount,</tspan><tspan x="1280" y="1028.2" dominant-baseline="middle">totalWithdrawn, timestamp</tspan></text><polygon points="802.5,930 870,962.5 802.5,995 735,962.5" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="802.5" y="962.5" dominant-baseline="middle">Mencatat</tspan></text><polyline points="520,755 686,755 686,962 735,962" fill="none" stroke="#222222" stroke-width="1.5"  /><polyline points="870,962 1060,962" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="968" y="944" dominant-baseline="middle">1 : 0..N</tspan></text><polyline points="1340,200 1535,200 1535,625 70,625 70,700 345,700 345,725" fill="none" stroke="#222222" stroke-width="1.5" stroke-dasharray="7 5" /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="840" y="593.3" dominant-baseline="middle">CAMPAIGNS.id ↔ campaignId: tautan aplikasi (text ↔ uint256)</tspan><tspan x="840" y="615.6999999999999" dominant-baseline="middle">Setiap metadata → 1 Campaign; setiap Campaign → 0..1 metadata.</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="800" y="1128" dominant-baseline="middle">Konektor utuh: relasi SQL / asosiasi blockchain. Konektor putus-putus: tautan lintas penyimpanan, bukan FK SQL.</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="800" y="1158.8" dominant-baseline="middle">PK = primary key | FK = foreign key | UQ = unique | 0..N = nol atau banyak.</tspan><tspan x="800" y="1181.2" dominant-baseline="middle">Berlaku untuk satu deployment kontrak. Struktur kontrak dan event bukan tabel PostgreSQL.</tspan></text></svg>