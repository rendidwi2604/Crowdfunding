<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Arial" font-size="25" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="800" y="39" dominant-baseline="middle">3.2.3 Logical Record Structure (LRS)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="middle" ><tspan x="800" y="72" dominant-baseline="middle">RuangBaik | Model hybrid: PostgreSQL (off-chain) + Ethereum Sepolia (on-chain)</tspan></text><rect x="40" y="105" width="1520" height="465" fill="#ffffff" stroke="#555555" stroke-width="1.5" stroke-dasharray="7 5"/><text font-family="Arial" font-size="18" fill="#555555" text-anchor="middle" ></text><text font-family="Arial" font-size="19" fill="#222222" text-anchor="start" font-weight="bold"><tspan x="77" y="128" dominant-baseline="middle">OFF-CHAIN — Record relasional PostgreSQL (Neon)</tspan></text><rect x="130" y="165" width="380" height="154" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="130" y="165" width="380" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="320" y="186" dominant-baseline="middle">USERS</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="142" y="221" dominant-baseline="middle">wallet_address [PK]</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="142" y="249" dominant-baseline="middle">name</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="142" y="277" dominant-baseline="middle">bio (nullable)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="142" y="305" dominant-baseline="middle">created_at</tspan></text><rect x="980" y="165" width="460" height="350" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="980" y="165" width="460" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="1210" y="186" dominant-baseline="middle">CAMPAIGNS</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="221" dominant-baseline="middle">id [PK]</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="249" dominant-baseline="middle">creator_address [FK]</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="277" dominant-baseline="middle">title</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="305" dominant-baseline="middle">description</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="333" dominant-baseline="middle">image_url</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="361" dominant-baseline="middle">category</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="389" dominant-baseline="middle">location</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="417" dominant-baseline="middle">organizer</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="445" dominant-baseline="middle">creation_block</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="473" dominant-baseline="middle">transaction_hash [UQ]</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="992" y="501" dominant-baseline="middle">created_at</tspan></text><polyline points="510,221 730,221 730,249 980,249" fill="none" stroke="#222222" stroke-width="1.5"  marker-end="url(#arrow)"/><text font-family="Arial" font-size="17" fill="#222222" text-anchor="middle" ><tspan x="745" y="284.3" dominant-baseline="middle">R01 — Membuat (1 : 0..N)</tspan><tspan x="745" y="308.1" dominant-baseline="middle">users.wallet_address [PK]</tspan><tspan x="745" y="331.9" dominant-baseline="middle">→ campaigns.creator_address [FK]</tspan><tspan x="745" y="355.7" dominant-baseline="middle">1 pengguna pembuat per kampanye</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="middle" ><tspan x="325" y="375.6" dominant-baseline="middle">Hanya bio yang nullable.</tspan><tspan x="325" y="399.40000000000003" dominant-baseline="middle">Kolom lainnya wajib terisi.</tspan></text><rect x="40" y="640" width="1520" height="445" fill="#ffffff" stroke="#536a83" stroke-width="1.5" stroke-dasharray="7 5"/><text font-family="Arial" font-size="18" fill="#536a83" text-anchor="middle" ></text><text font-family="Arial" font-size="19" fill="#222222" text-anchor="start" font-weight="bold"><tspan x="77" y="663" dominant-baseline="middle">ON-CHAIN — Ethereum Sepolia / smart contract Crowdfunding</tspan></text><rect x="110" y="723" width="480" height="210" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="110" y="723" width="480" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="350" y="744" dominant-baseline="middle">Campaign «struct dalam mapping»</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="779" dominant-baseline="middle">campaignId : uint256 (kunci mapping)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="807" dominant-baseline="middle">creator : address</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="835" dominant-baseline="middle">target : uint256 (wei)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="863" dominant-baseline="middle">deadline : uint256 (Unix detik)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="891" dominant-baseline="middle">raised : uint256 (wei)</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="122" y="919" dominant-baseline="middle">withdrawn : uint256 (wei)</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="350" y="975.8" dominant-baseline="middle">campaigns: mapping(uint256 =&gt; Campaign)</tspan><tspan x="350" y="998.1999999999999" dominant-baseline="middle">campaignId bukan anggota struct Campaign.</tspan></text><rect x="1020" y="705" width="470" height="70" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="1020" y="705" width="470" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="1255" y="726" dominant-baseline="middle">CampaignCreated «event»</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="1032" y="761" dominant-baseline="middle">campaignId, creator, target, deadline</tspan></text><polyline points="590,775 720,775 720,740 1020,740" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="912.5" y="719" dominant-baseline="middle">1 : 1 (pembuatan)</tspan></text><rect x="1020" y="817" width="470" height="70" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="1020" y="817" width="470" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="1255" y="838" dominant-baseline="middle">DonationReceived «event»</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="1032" y="873" dominant-baseline="middle">campaignId, donor, amount, timestamp</tspan></text><polyline points="590,775 765,775 765,852 1020,852" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="912.5" y="831" dominant-baseline="middle">1 : 0..N</tspan></text><rect x="1020" y="929" width="470" height="98" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" ></text><rect x="1020" y="929" width="470" height="42" fill="#ffffff" stroke="#222222" stroke-width="1.5" /><text font-family="Arial" font-size="18" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="1255" y="950" dominant-baseline="middle">FundsWithdrawn «event»</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="1032" y="985" dominant-baseline="middle">campaignId, creator, amount,</tspan></text><text font-family="Arial" font-size="17" fill="#222222" text-anchor="start" ><tspan x="1032" y="1013" dominant-baseline="middle">totalWithdrawn, timestamp</tspan></text><polyline points="590,775 810,775 810,964 1020,964" fill="none" stroke="#222222" stroke-width="1.5"  /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="912.5" y="943" dominant-baseline="middle">1 : 0..N</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="1120" y="1047.5" dominant-baseline="middle">TxHash dan nomor blok berasal dari log/receipt; bukan parameter event.</tspan></text><polyline points="1440,221 1535,221 1535,625 70,625 70,700 350,700 350,723" fill="none" stroke="#222222" stroke-width="1.5" stroke-dasharray="7 5" /><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="920" y="591.8" dominant-baseline="middle">CAMPAIGNS.id (text) ↔ campaignId (uint256): satu metadata untuk satu kampanye.</tspan><tspan x="920" y="614.1999999999999" dominant-baseline="middle">Campaign on-chain dapat belum memiliki metadata (0..1); tautan ini bukan FK SQL.</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="800" y="1128" dominant-baseline="middle">Konektor utuh: relasi SQL / asosiasi blockchain. Konektor putus-putus: tautan lintas penyimpanan, bukan FK SQL.</tspan></text><text font-family="Arial" font-size="16" fill="#222222" text-anchor="middle" ><tspan x="800" y="1158.8" dominant-baseline="middle">PK = primary key | FK = foreign key | UQ = unique | 0..N = nol atau banyak.</tspan><tspan x="800" y="1181.2" dominant-baseline="middle">Berlaku untuk satu deployment kontrak. Struktur kontrak dan event bukan tabel PostgreSQL.</tspan></text></svg>